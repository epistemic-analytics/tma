[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyTMA"
version = "0.1.0"
description = "Python TMA (Transmodal Analysis) modeling — sister package to tma"
requires-python = ">=3.10"
dependencies = [
    "pylibqe",
    "numpy>=1.24",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
