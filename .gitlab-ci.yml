stages:
  - build
  - test

# ── shared pip cache ──────────────────────────────────────────────────────────
.pip-cache: &pip-cache
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.pip-cache]
    policy: pull-push

.wasm-conan-cache: &wasm-conan-cache
  cache:
    key: conan2-wasm-$CI_COMMIT_REF_SLUG
    paths: [wasm/.conan2]
    policy: pull-push

# ── tma-wasm's libtma module (C++ → WASM), as libqe's / rENA's build:wasm ──────
# test:wasm (from cranqe's npm-registry.yml template) consumes wasm/dist/.
build:wasm:
  stage: build
  image: emscripten/emsdk:latest
  variables:
    # Conan's home inside the project dir so the cache can keep Armadillo.
    CONAN_HOME: "$CI_PROJECT_DIR/wasm/.conan2"
  <<: *wasm-conan-cache
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends ninja-build
    - pip install conan --quiet --break-system-packages
    - conan profile detect --force
  script:
    - sh wasm/scripts/build.sh
  artifacts:
    paths: [wasm/dist/]
    expire_in: 1 day

# ── R package tests ───────────────────────────────────────────────────────────
test:r:
  stage: test
  needs: []   # don't wait for build:wasm
  image: rocker/r-ver:4.5.0
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        build-essential gfortran libopenblas-dev liblapack-dev
        libxml2-dev libcurl4-openssl-dev libssl-dev
    - Rscript -e "install.packages(
        c('data.table', 'rlang', 'Rcpp', 'RcppArmadillo', 'libqe',
          'testthat', 'knitr', 'rmarkdown', 'jsonlite'),
        repos = c(
          'https://qe-libs.org/cran/',
          'https://packagemanager.posit.co/cran/__linux__/noble/latest'
        ),
        quiet = TRUE)"
  script:
    - R CMD INSTALL .
    - Rscript -e "testthat::test_local('.', reporter = 'progress')"

# ── Python bindings tests (pyTMA) ─────────────────────────────────────────────
test:python:
  stage: test
  needs: []   # don't wait for build:wasm
  image: python:3.12-slim
  <<: *pip-cache
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends build-essential cmake libarmadillo-dev git
    # Public dependencies from PyPI, then qe-lib and qe-ena (>= 0.1.6, for
    # ena.libena) from qe-libs.org *only*: --extra-index-url would let pip
    # pick a same-named package from PyPI (PyPI's pyena is unrelated).
    - pip install --cache-dir .pip-cache numpy pandas pytest
    - pip install --cache-dir .pip-cache --no-deps
        --index-url https://qe-libs.org/py/dev/simple/ qe-lib qe-ena
  script:
    # tma._libtma builds against headers vendored into python/include/
    # (libtma from inst/include, libqe from Conan).
    - sh scripts/sync-headers.sh
    - cd python
    - pip install --cache-dir ../.pip-cache ".[dev]"
    # importlib mode tests the installed package: the source tree has no
    # compiled tma._libtma.
    - pytest tests/ -v --import-mode=importlib

# ── wasm package tests ────────────────────────────────────────────────────────
# The rest of the job (image, registry setup, script) comes from cranqe's
# npm-registry.yml template.
test:wasm:
  needs: [build:wasm]

# ── cranqe integration ────────────────────────────────────────────────────────
# verify-tag-version (.pre, tags):  confirm git tag == DESCRIPTION Version
# trigger-cranqe     (.post, main): request a dev build after every push
# trigger-cranqe-release (.post, tags): request a release build after a tag
include:
  - project: 'epistemic-analytics/qe-packages/cranqe'
    ref: main
    file: '/ci-templates/trigger-cranqe.yml'
  - project: 'epistemic-analytics/qe-packages/cranqe'
    ref: main
    file: '/ci-templates/npm-registry.yml'
