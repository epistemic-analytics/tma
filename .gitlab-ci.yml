stages:
  - build
  - release


check_release:
  image: rocker/verse
  stage: build
  artifacts:
    reports:
      dotenv: variables.env
    paths:
      - archive/
    expire_in: 30 day
  before_script:
    - apt update && apt install -y curl
  script:
    - |
      export VERSION=$(awk -F ':' '/^'Version': /{print $2}' "./DESCRIPTION" | xargs)
      export PACKAGE="tma_$VERSION.tar.gz"
      R -e 'install.packages("markdown")'
      R CMD build .
      export checked=$(R CMD check $PACKAGE)
      echo $checked | grep -q "Status: OK"
      if [ $? -ne 0 ]; then
        echo "Command failed."
        exit 1
      else
        echo "Success! Move tar to archive!"
        mkdir -p ./archive/
        mv $PACKAGE ./archive/
        ls -al ./archive/
        echo CRANQE_RELEASE="1" >> ./variables.env
        echo CRANQE_PKG_VERSION="${PACKAGE}" >> ./variables.env
      fi


variables:
  PKG: "tma"
  PKGL: "tma"

# include:
#   - project: 'epistemic-analytics/qe-packages/cranqe'
#     ref: main
#     file: '/public/ci_templates/cranqe_release_template.yml'

.cranqe_template: &cranqe_template
  stage: release
  image: rocker/tidyverse:4.1.1
  artifacts:
    reports:
      dotenv: variables.env
    paths:
      - archive/
    expire_in: 1 week
  script:
    - printenv
    - "echo CRANQE_RELEASE: $CRANQE_RELEASE"
    - "echo DEPLOY_PAGES: $DEPLOY_PAGES"
    - "echo DEPLOY_PACKAGES: $DEPLOY_PACKAGES"
    - "echo CRANQE_STEP: $CRANQE_STEP"
    - "echo CRANQE_PKG_VERSION: $CRANQE_PKG_VERSION"
    - apt update && apt install -y curl libxt-dev
    - |
      curl --trace - --request POST \
        --form "token=$CI_JOB_TOKEN" \
        --form "variables[QE_PROJECT_NAME]=tma" \
        --form "variables[QE_PROJECT_ID]=${CI_PROJECT_ID}" \
        --form "variables[QE_JOB_ID]=${CI_JOB_ID}" \
        --form "variables[QE_PKG_VERSION]=${CRANQE_PKG_VERSION}" \
        -F variables[${CRANQE_STEP}]=true \
        --form ref=main \
        https://gitlab.com/api/v4/projects/22522458/trigger/pipeline
  only:
    refs:
      - main
    variables:
      #- $CRANQE_RELEASE
      - $CI_COMMIT_MESSAGE =~ /\[(cranqe[^\]*]*(pkg|pages))/

release:cranqe_pages:
  <<: *cranqe_template
  variables:
    CRANQE_STEP: DEPLOY_PAGES

release:cranqe_package:
  <<: *cranqe_template
  variables:
    CRANQE_STEP: DEPLOY_PACKAGES
