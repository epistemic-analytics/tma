stages:
 - docker
 - test
 - check
 - deploy
 - release

variables:
  VERSION: "0.1.0.9000"
  PKG: "tma"
  PKGL: "tma"
  REG_URL: "${CI_REGISTRY}/epistemic-analytics/qe-packages/${PKGL}"

# Templates
.build_definition: &build_template
  before_script:
    - export _R_CHECK_CRAN_INCOMING_="true"
    - export _R_CHECK_CRAN_INCOMING_REMOTE_="true"
    - export _R_CHECK_FORCE_SUGGESTS_="true"
    - export _R_CLASS_MATRIX_ARRAY_="true"
    - export R_REMOTES_STANDALONE="true"
    - export R_REMOTES_NO_ERRORS_FROM_WARNINGS="true"
    - export TZ=Europe/London
    - export _R_CHECK_LENGTH_1_CONDITION_="package:_R_CHECK_PACKAGE_NAME_,verbose"
    - mkdir -p archive/
    - cat DESCRIPTION
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - cd ..; R CMD build --resave-data --no-manual --log $PKG

test:
  stage: test
  image: $REG_URL/release-test:latest
  script:
    - "sed -i -e \"s/Version: \\(.*\\)/Version: ${VERSION}/\" DESCRIPTION"
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - |
        Rscript -e "test_results <- devtools::test();
                    all_passed <- all(sapply(lapply(test_results, '[[', 'results'), function(l) {
                      all(sapply(l, inherits, 'expectation_success'));
                    }));
                    print(paste0('Tests passed: ', all_passed));
                    if (all_passed == TRUE) {
                      quit(status = 0);
                    }
                    else {
                      quit(status = 1);
                    }"
  except:
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[skip tests\].*/


# Rhub Checks
.rhub_condition: &rhub_condition
  except:
    refs:
      - tags
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[skip checks\].*/
.rhub_definition: &rhub_definition
  stage: check
  image: $CI_REGISTRY_IMAGE/release:latest
  before_script:
    - Rscript -e 'install.packages("rhub")'
  script:
    - |
        Rscript -e "rhub::validate_email(email = \"${RHUB_EMAIL_ADDRESS}\", token = \"${RHUB_EMAIL_TOKEN}\");
                    checked <- rhub::check(
                      platform = \"${RHUB_PLATFORM}\", show_status = TRUE,
                      env_vars = c(
                        \"_R_CHECK_CRAN_INCOMING_\" = \"true\",
                        \"_R_CHECK_CRAN_INCOMING_REMOTE_\" = \"true\",
                        \"_R_CHECK_FORCE_SUGGESTS_\" = \"true\",
                        \"_R_CLASS_MATRIX_ARRAY_\"=\"true\",
                        \"R_REMOTES_STANDALONE\"=\"true\",
                        \"R_REMOTES_NO_ERRORS_FROM_WARNINGS\"=\"true\"
                      )
                    );
                    checked\$cran_summary();
                    rhub_content <- function(text_url) {
                      text_get <- httr::GET(url = text_url)
                      test_content <- strsplit(httr::content(text_get), split = \"\\\\n\")[[1]];
                      err_found <- grep(x = test_content, pattern = \"runtime error\");
                      print(test_content[err_found]);
                      return(err_found);
                    }
                    if(!checked\$.__enclos_env__\$private\$status_[[1]]\$status %in% c('error', 'warning')) {
                      rhub_errors <- rhub_content(checked\$urls()\$text);
                      if(length(rhub_errors) > 0) { quit(status = 1); }
                      else { quit(status = 0); }
                    } else { quit(status = 1); }"
  only:
    refs:
      - master
      - branches
    variables:
      - $RHUB_EMAIL_ADDRESS
      - $RHUB_EMAIL_TOKEN
  <<: *rhub_condition
check:r-hub-windows-old-release:
  variables:
    RHUB_PLATFORM: "windows-x86_64-oldrel"
  <<: *rhub_definition
check:r-hub-windows-release:
  variables:
    RHUB_PLATFORM: "windows-x86_64-release"
  <<: *rhub_definition
check:r-hub-macos-highsierra-release-cran:
  variables:
    RHUB_PLATFORM: "macos-highsierra-release-cran"
  <<: *rhub_definition
  
