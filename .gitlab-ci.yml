.release_definition: &release_definition
  stage: release
  image: $REG_URL/release:latest
  #dependencies:
  #  - check:r-release
  only:
    refs:
      - tags
    variables:
      - $CI_COMMIT_TAG
  except:
    - branches
    - master
  <<: *build_template
  script:
    - cat ./${PKG}/cran-comments.md || true
    - ls -al || true
    - Rscript -e "devtools:::upload_cran(devtools::as.package(\"${PKG}\"), \"./${PKG}_${VERSION}.tar.gz\")"
    - "curl --request POST --header \"PRIVATE-TOKEN: ${GITLAB_API_TOKEN}\" --data-urlencode \"tag_name=${VERSION}\" --data-urlencode \"name=v${VERSION}\" --data-urlencode \"description=Automatically created from CI for ${VERSION}\" \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases?ref=${CI_COMMIT_REF_NAME}\""
  allow_failure: false
release:cran-manual:
  <<: *release_definition
  when: manual

pages:
  stage: deploy
  image: $REG_URL/release-test:latest
  script:
    #- rm -rf src/RcppExports*
    #- rm -rf R/RcppExports*
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - Rscript -e 'install.packages("microbenchmark")'
    #- Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e "devtools::install(\".\", quick = T, build = T, dependencies = F, upgrade = F)"
    - Rscript -e "pkgdown::build_site(preview = F, devel = T, lazy = T, new_process = T)"
    - |
        Rscript -e "cov <- covr::package_coverage(quiet = F);
                    rep <- covr::report( x = cov, file = \"public/coverage/index.html\", browse = FALSE );"
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - master
  except:
    refs:
      - tags
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[skip pages\].*/

release:cranqe:
  stage: release
  image: $REG_URL/release-test:latest
  #<<: *build_template
  artifacts:
    paths:
      - archive/
    expire_in: 1 week
  only:
    refs:
      - master
  script:
    - export VERSION_TIMESTAMP=$(date +%y%m%d%H%M)
    - echo $VERSION_TIMESTAMP
    - cat DESCRIPTION
    - "sed -i -e \"s/Version: \\(.*\\)/Version: ${VERSION}.${VERSION_TIMESTAMP}/\" DESCRIPTION"
    - cat DESCRIPTION
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - mkdir -p archive/
    - ls -al
    - cd ..; R CMD build --resave-data --no-manual --log $PKG
    - ls -al
    - mv ./${PKG}_${VERSION}.${VERSION_TIMESTAMP}.tar.gz $PKG/archive/
    - curl --request POST --form "token=$CI_JOB_TOKEN" --form "variables[QE_PROJECT_NAME]=${CI_PROJECT_NAME}" --form "variables[QE_PROJECT_ID]=${CI_PROJECT_ID}" --form ref=master https://gitlab.com/api/v4/projects/22522458/trigger/pipeline

# Docker Image steps --------

.docker_variables: &docker_variables
  DOCKER_HOST: tcp://localhost:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
.docker_definition: &docker_template
  stage: docker
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/$TAG:current -f inst/docker/${PKG}-${FILE} inst/docker/
    - docker push $CI_REGISTRY_IMAGE/$TAG:current
  only:
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[build docker\].*/ || $DOCKER_FORCE_REBUILD
docker:release:
  variables:
    <<: *docker_variables
    TAG: "release"
    FILE: "release"
  <<: *docker_template
docker:release-test:
  variables:
    <<: *docker_variables
    TAG: "release-test"
    FILE: "release-test"
  <<: *docker_template
docker:old-release:
  variables:
    <<: *docker_variables
    TAG: "old-release"
    FILE: "oldrelease"
  <<: *docker_template
docker:devel:
  variables:
    <<: *docker_variables
    TAG: "devel"
    FILE: "devel"
  <<: *docker_template
docker:devel-san:
  variables:
    <<: *docker_variables
    TAG: "devel-san"
    FILE: "devel-san"
  <<: *docker_template

# End: Docker ----- 