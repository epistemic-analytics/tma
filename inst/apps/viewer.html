d off with all the batteries.","Data":1,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":33,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"Its more risky because it had the highest RPN","Data":1,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":34,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"As far as risk and cost, the NiCd seems to be the best. It has medium risk and a low cost. However, its other traits did not impress me.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":35,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"As far as risk and cost, the NiCd seems to be the best. It has medium risk and a low cost. However, its other traits did not impress me.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":36,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"@Brandon: Ya I agree with that.","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":37,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"I would choose based on lower cost and more reliable and also something that would be convenient for the operator.","Data":1,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":38,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"I would assess the five attributes of the RescuShell. Safety, cost, and recharge interval are affected by the battery. It also adds to the payload, so a heavier battery is less desirable. The recharge interval is mainly associated with the battery, though, so this should be most important.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":39,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"I would assess the five attributes of the RescuShell. Safety, cost, and recharge interval are affected by the battery. It also adds to the payload, so a heavier battery is less desirable. The recharge interval is mainly associated with the battery, though, so this should be most important.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":40,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"I decided how long the battery can last while maintaining voltage and the cost of the battery as most important","Data":0,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":41,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"The paper said it NiPd was more inefficient but I think according to the graphs in the testing report. It looks that NiPd lasted longer than LiPO","Data":1,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":42,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"Lithium Polymer Battery 54 72Nickel Cadmium Battery 39 56Hydrogen Pro Fuel Cell 78 20","Data":1,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":43,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"Well I have one, Vedant sent me an email saying my synthesis was what he was looking for but then 45 seconds later he sent another one that said it was a good synthesis and gave me directions for the worklog so does that mean my synthesis was approved?","Data":1,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":44,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"No questions. Notebooks are due basically within 23 hours, worklogs are due in advance of the next work period.","Data":1,"Technical rName":"brandon l","GroupName":"Electric","text":"Sensors excelled in certain areas but were overall equal to each other over all five attributes. NiCd had the highest combination of attributes for the batteries.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":54,"QEUNIT":"FirstGame::steven z","Condition":"FirstGame","UserName":"steven z","GroupName":"Electric","text":"Well i just used evaluations of them as a point system which would determine which has the overall most efficiency and functionability.","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":55,"QEUNIT":"FirstGame::steven z","Condition":"FirstGame","UserName":"steven z","GroupName":"Electric","text":"I recommend the Strain-Gauge Control Sensor","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":56,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"I felt PFC and and NiCd were about equal but NiCd was better in the more important areas of safety and payload. I think the sensors are about even but I think the Piezoelectric sensor was the best choice.","Data":0,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":57,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"No, there was not a clearly superior sensor. I chose the piezoelectric sensor because it seemed to be the most balanced to me.","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":58,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"No, there was not a clearly superior sensor. I chose the piezoelectric sensor because it seemed to be the most balanced to me.","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":59,"QEUNIT":"FirstGame::steven z","Condition":"FirstGame","UserName":"steven z","GroupName":"Electric","text":"The sensors are nearly identical in value","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":60,"QEUNIT":"FirstGame::steven z","Condition":"FirstGame","UserName":"steven z","GroupName":"Electric","text":"with different strengths and weaknesses to each of them","Data":1,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":61,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"I chose based on which graph had the largest area inside of it but if it was about equal I selected based on categories I felt were most important such as safety and payload.","Data":1,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":62,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"The best one is the one with the highest total desirability over all five attributes (payload, agility, recharge interval, cost, and safety).","Data":1,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":63,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"The best one is the one with the highest total desirability over all five attributes (payload, agility, recharge interval, cost, and safety).","Data":1,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":64,"QEUNIT":"FirstGame::steven z","Condition":"FirstGame","UserName":"steven z","GroupName":"Electric","text":"Like I said using the values given can be used as a point system which is essentially the same as the area enclosed by the graph. The most total points indicates the most valuable components","Data":1,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":65,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"I agree. Safety was a key concern to me, more important than cost, and that helped me decide to choose the piezoelectric sensor. The cost is not MUCH more than the strain-gauge sensor, but its safet  cares if it works when it is supposed to and would probably pay extra money in order to have so","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":265,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"Agility allows them to move well to stay safe and get to whoever or whatever they're rescuing. Payload allows them to actually rescue people.","Data":1,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":266,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"Agility allows them to move well to stay safe and get to whoever or whatever they're rescuing. Payload allows them to actually rescue people.","Data":1,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":267,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"I thought that safety near the maximum was not very good (close to 225 - one had 218 RPN), but other than that I was fine with the safety as long as it was around 200 or lower.","Data":1,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":268,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"I thought that safety near the maximum was not very good (close to 225 - one had 218 RPN), but other than that I was fine with the safety as long as it was around 200 or lower.","Data":1,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":269,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"@Brandon: Ya I agree. I think we need to find a way to increase payload for our next tests","Data":0,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":270,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"It was fairly successful. We discovered what was good or bad about our prototypes. Agility and payload were issues for opposite reasons.","Data":0,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":271,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"It was fairly successful. We discovered what was good or bad about our prototypes. Agility and payload were issues for opposite reasons.","Data":0,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":272,"QEUNIT":"FirstGame::steven z","Condition":"FirstGame","UserName":"steven z","GroupName":"Electric","text":"I just wrote the same thing in my notebook. Increase the payload and decrease the agility which increases the recharge interval and decreases the price at the same time.","Data":0,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":273,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"Payload and recharge are almost opposites. None of the prototypes we submitted were good at both.","Data":0,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":274,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"Payload and recharge are almost opposites. None of the prototypes we submitted were good at both.","Data":0,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":275,"QEUNIT":"FirstGame::steven z","Condition":"FirstGame","UserName":"steven z","GroupName":"Electric","text":"Yes, but decreasing the agility because we have a it of excessive agility taking into account what the consultants said.","Data":0,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":276,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"@Justin Kim: We now know how some of the components add up when put together","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":277,"QEUNIT":"FirstGame::alexander b","Condi m: I was working on the next step and the resources page won't open.","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":293,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"@Brandon: Are you working on your presentation? If you are how long do think each section should be?","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":294,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"@Akash: I'm evaluating and comparing prototypes right now, since that's a main part of the presentation.","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":295,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"@Akash: I'm evaluating and comparing prototypes right now, since that's a main part of the presentation.","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":296,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"Electric","text":"@Justin Kim: When is this presentation due?","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":297,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"@Justin Kim: Thank you for working with us these weeks.","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":298,"QEUNIT":"FirstGame::brandon l","Condition":"FirstGame","UserName":"brandon l","GroupName":"Electric","text":"@Justin Kim: Thank you for working with us these weeks.","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":1304,"QEUNIT":"FirstGame::robert z","Condition":"FirstGame","UserName":"robert z","GroupName":"1","text":"Hello Justin and Team, I'm Robert.  I worked with the Pneumatic team before.","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":1305,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"1","text":"Hi, I am Akash and I worked with the electric actuator before this group.","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":1306,"QEUNIT":"FirstGame::amirah u","Condition":"FirstGame","UserName":"amirah u","GroupName":"1","text":"Hello, I am Amirah. I previously worked with Series Elastic actuator.","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":1307,"QEUNIT":"FirstGame::peter s","Condition":"FirstGame","UserName":"peter s","GroupName":"1","text":"Hi, I am Peter. I previously worked with the series elastic team","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":1308,"QEUNIT":"FirstGame::jimmy i","Condition":"FirstGame","UserName":"jimmy i","GroupName":"1","text":"Hello, I am Jimmy and I worked with the Hydraulic actuator on my previous team","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":1309,"QEUNIT":"FirstGame::amirah u","Condition":"FirstGame","UserName":"amirah u","GroupName":"1","text":"yes i am. and i already posted in the chat that i previously worked with series elastic team.","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":1310,"QEUNIT":"FirstGame::robert z","Condition":"FirstGame","UserName":"robert z","GroupName":"1","text":"I worked with the Pneumatic Actuator.  For a quick review, its strengths lie in that it is energy-efficient and cost-effective because it only uses pressurized air.  However, due to that use of pressurized air, it lacks in its agility and payload capacity.","Data":0,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":1311,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"1","text":"Ok I had the electric actuator and we kept what we found was as ROM went up the agility and payload went up but the recharge interval went down. All the prototypes we designed were good however I think it need to increase payload and recharge interval and lower cost. I would say the electric actuator is good for agility and safety.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":1312,"QEUNIT":"FirstGame::jimmy i","Condition":"FirstGame","UserName":"jimmy i","GroupName":"1","text":"So Hydraulic actuators use fluid to generate work with a piston. It can generate the highest payload capacity, as the fluid is in-compressible in nature, but that also means that it lacks in agility due to friction in the piston rods.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":1313,"QEUNIT":"FirstGame::peter s","Condition":"FirstGame","UserName":"peter s","GroupName":"1","text":"I researched the series electric actuator. The series elastic actuator had a larger payload, but as the ROM went up the best advantage to the series elastic actuator was balanced out in a negative fashion by the rapidly decreasing recharge interval. The series elastic actuator also had a higher cost as well.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":1314,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"1","text":"I am wondering, did anybody have a prototype that was able to meet the internal consultants recharge interval or is that something we might not be able to accomplish and focus on more important characteristics to the workers such as payload and agility.","Data":0,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":1315,"QEUNIT":"FirstGame::peter s","Condition":"FirstGame","UserName":"peter s","GroupName":"1","text":"No, my previous group was not able to meet any of the requests from the internal consultants. However, we got close on a few designs to meeting requests","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":1316,"QEUNIT":"FirstGame::robert z","Condition":"FirstGame","UserName":"robert z","GroupName":"1","text":"What were your two best prototypes you each would have chosen? Our two best were both made with Aluminum, NiCd Batteries, Piezoelectric sensors, and Pneumatic actuators.  They differed with ROM 3 and 4.  ROM 3 gave us excellent results in all fields except for payload.  ROM 4 was the same but lacked in Recharge Interval when it made up in Payload.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":1317,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"1","text":"We were able to accomplish agility and a couple met safety. our cost met the minimum standards and payload did as well but we were not able to meet recharge interval.","Data":0,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":1318,"QEUNIT":"FirstGame::robert z","Condition":"FirstGame","UserName":"robert z","GroupName":"1","text":"I don't believe any of our prototypes will meet all of the requests.  We have to decide if strong suits in all other fields is worth lacking in something like recharge interval.","Data":1,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":1319,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"1","text":"well it sounds like Robert's was pretty good if we can get a way in increase payload.","Data":0,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":1320,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"1","text":"@Jimmy: i agree with that","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":1321,"QEUNIT":"FirstGame::jimmy i","Condition":"FirstGame","UserName":"jimmy i","GroupName":"1","text":"We may have to minimize recharge interval but we shouldn't disregard it completely","Data":0,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":1322,"QEUNIT":"FirstGame::robert z","Condition":"FirstGame","UserName":"robert z","GroupName":"1","text":"My first prototype with ROM 3 managed a 7.38 recharge interval which basically meets the requests.  However payload was lowest with only 480.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":1323,"QEUNIT":"FirstGame::amirah u","Condition":"FirstGame","UserName":"amirah u","GroupName":"1","text":"i would say the best prototype i would choose are aluminum, PFC, series elastic, piezoelectric, at rom 3 - this gave us the best results for getting the longest recharge interval, cost effective and also safety.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":1324,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"1","text":"Well i had a 2 meet the minimum payload with 536 but its recharge was 6.40 and 6.23. we also made a steel one that was extremely strong in payload but it was bad in all the other categories.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":1325,"QEUNIT":"FirstGame::jimmy i","Condition":"FirstGame","UserName":"jimmy i","GroupName":"1","text":"My previous team came up with a prototype that had 876 payload with a 6.58 recharge interval while also being relatively inexpensive and safe","Data":1,"Technical.Constraints":0,"Performance.Parameters":1},{"QEID":1326,"QEUNIT":"FirstGame::robert z","Condition":"FirstGame","UserName":"robert z","GroupName":"1","text":"My prototype with ROM 4 had 528 for payload, 254 for agility, 6.85 for recharge, 12740 for cost and 197 for safety.","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":1327,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"1","text":"My prototype with ROM 4 had 536 payload, 314 agility, 6.40 recharge interval, 14315 cost, and 182 safety","Data":1,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":1328,"QEUNIT":"FirstGame::jimmy i","Condition":"FirstGame","UserName":"jimmy i","GroupName":"1","text":"We should look at what material we want to use and then pick a few different options for the power source, actuator, control, and ROM components","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":1329,"QEUNIT":"FirstGame::robert z","Condition":"FirstGame","UserName":"robert z","GroupName":"1","text":"Lets start with material. Is anyone opposed to Aluminum?","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":1330,"QEUNIT":"FirstGame::robert z","Condition":"FirstGame","UserName":"robert z","GroupName":"1","text":"If 6.85 is an acceptable level for the rest of our team, that design worked well and could be compared to the other top models in our new batch.","Data":1,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":1331,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"1","text":"I think aluminum is fine but i also liked composite","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":1332,"QEUNIT":"FirstGame::jimmy i","Condition":"FirstGame","UserName":"jimmy i","GroupName":"1","text":"Aluminum and Composite are good options. Steel can carry a big load, but it is heavy and weighs down on the recharge interval, and it is a costly option.","Data":0,"Technical.Constraints":1,"Performance.Parameters":1},{"QEID":1333,"QEUNIT":"FirstGame::peter s","Condition":"FirstGame","UserName":"peter s","GroupName":"1","text":"Yeah exactly. I was just about to say aluminum or composite","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":1334,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"1","text":"@Jimmy: I agree with that","Data":0,"Technical.Constraints":0,"Performance.Parameters":0},{"QEID":1335,"QEUNIT":"FirstGame::akash v","Condition":"FirstGame","UserName":"akash v","GroupName":"1","text":"I thought the NiCd was the best battery","Data":0,"Technical.Constraints":1,"Performance.Parameters":0},{"QEID":1336,"QEUNIT":"FirstGame::amirah u","Condition":"FirstGame","UserName":"amirah u","GroupName":"1","text":"yes i agree using both of the materials in th       let lou = {
        proxyList: {
          set: (target, key, value) => {
            target[key] = value;
            return(true);
          },
          get: function(target, key, receiver) {
            if(key === "before") {
              return function(e, i) {
                let cloned_e, added = [];
                [...target].forEach( t => {
                  cloned_e = e.cloneNode(true);
                  added.push(new Proxy(cloned_e, lou.proxy));
                  t.before(cloned_e);
                });
                return new Proxy(added, lou.proxyList);
              }
            }
            if(key === "after") {
              return function(e, i) {
                let cloned_e, added = [];
                [...target].forEach( t => {
                  cloned_e = e.cloneNode(true);
                  added.push(new Proxy(cloned_e, lou.proxy));
                  t.after(cloned_e);
                });
                return new Proxy(added, lou.proxyList);
              }
            }
            else if (key === "addEventListener") {
              return function(e, f) {
                [...target].forEach( t => {
                  t.addEventListener(e, f);
                });
                return receiver;
              }
            }
          }
        },
        proxy: {
          set: (target, key, value) => {
            target[key] = value;
            return(true);
          },
          get: function(target, key, receiver) {
            let _this = this;
            
            if(key === "data") {
              return function(e) {
                if(!e) {
                  return(target[`_${key}_`])
                } else {
                  target[`_${key}_`] = e;
                  return receiver;
                }
              }
            }
            else if (key === "join") {
              return function(...args) {
                let 
                  enter = args[0], 
                  updated = args[1],
                  exit = args[2],
                  data = this.data()
                ;
                let i = 0;
                for(let ei in data) {
                  let e = data[ei];
                  enter.apply(this, [e, i]);
                  i = i + 1;
                }
                return receiver;
              }
            }
            else if (key === "end") {
              return function(n) {
                let p = receiver;
                while (n > 0) {
                  p = p.parentElement;
                  n = n - 1;
                }
                return (lou.q(p));
              }
            }
            else {
              const value = target[key];
              if (value instanceof Function) {
                return function (...args) {
                  return value.apply(this === receiver ? target : this, args);
                };
              }
              else {
                return target[key];
              }
            }
          }
        },
        q: (sel) => {
          let 
            elm = typeof sel === "string" ? document.querySelector(sel) : sel,

          ;

            obj = new Proxy(elm, lou.proxy)
